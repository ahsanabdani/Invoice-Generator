<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <span class="h-icon">🧾</span>
    <h1>Invoice <em>Generator</em></h1>
    <span class="h-sep"></span>
    <span class="h-stack">Python · Flask · ReportLab</span>
  </header>
  <div class="header-accent"></div>

  <form method="POST" action="/generate" id="inv-form" onsubmit="onSubmit(event)">
    <div class="wrap">

      <!-- ── Left: Form Sections ── -->
      <div class="left">

        <!-- Business Details -->
        <div class="card">
          <div class="ch">
            <div class="ch-icon">🏢</div>
            <h2>Business Details</h2>
          </div>
          <div class="cb">
            <div class="fg">
              <div class="f s2">
                <label>Company Name</label>
                <input type="text" name="company_name" placeholder="Acme Creative Studio" autocomplete="organization">
              </div>
              <div class="f">
                <label>Email</label>
                <input type="email" name="company_email" placeholder="hello@acme.com">
              </div>
              <div class="f">
                <label>Phone</label>
                <input type="tel" name="company_phone" placeholder="+1 (555) 000-0000">
              </div>
              <div class="f s2">
                <label>Address</label>
                <textarea name="company_address" rows="2"
                  placeholder="123 Main St, Suite 4&#10;New York, NY 10001"></textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- Invoice Details -->
        <div class="card">
          <div class="ch">
            <div class="ch-icon">📋</div>
            <h2>Invoice Details</h2>
          </div>
          <div class="cb">
            <div class="fg fg3">
              <div class="f">
                <label>Invoice #</label>
                <input type="text" name="invoice_number" value="INV-001" id="inv-num" oninput="syncRef(this.value)">
              </div>
              <div class="f">
                <label>Issue Date</label>
                <input type="date" name="issue_date" id="issue-date">
              </div>
              <div class="f">
                <label>Due Date</label>
                <input type="date" name="due_date" id="due-date">
              </div>
            </div>
          </div>
        </div>

        <!-- Bill To -->
        <div class="card">
          <div class="ch">
            <div class="ch-icon">👤</div>
            <h2>Bill To</h2>
          </div>
          <div class="cb">
            <div class="fg">
              <div class="f s2">
                <label>Client / Company Name</label>
                <input type="text" name="client_name" placeholder="Horizon Media Ltd.">
              </div>
              <div class="f s2">
                <label>Email</label>
                <input type="email" name="client_email" placeholder="accounts@horizon.com">
              </div>
              <div class="f s2">
                <label>Address</label>
                <textarea name="client_address" rows="2"
                  placeholder="456 Client Ave&#10;Los Angeles, CA 90001"></textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- Line Items -->
        <div class="card">
          <div class="ch">
            <div class="ch-icon">📦</div>
            <h2>Line Items <span class="badge" id="item-ct">1</span></h2>
          </div>
          <div class="cb">
            <table class="tbl">
              <thead>
                <tr>
                  <th>Description</th>
                  <th class="r" style="width:62px">Qty</th>
                  <th class="r" style="width:96px">Unit Price</th>
                  <th class="r" style="width:88px">Amount</th>
                  <th class="del-col"></th>
                </tr>
              </thead>
              <tbody id="items-body"></tbody>
            </table>
            <button type="button" class="add-row-btn" onclick="addRow()">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <line x1="7" y1="2" x2="7" y2="12" />
                <line x1="2" y1="7" x2="12" y2="7" />
              </svg>
              Add Line Item
            </button>
          </div>
        </div>

        <!-- Tax / Discount / Notes -->
        <div class="card">
          <div class="ch">
            <div class="ch-icon">💰</div>
            <h2>Tax, Discounts &amp; Notes</h2>
          </div>
          <div class="cb">
            <div class="fg fg3">
              <div class="f">
                <label>Tax Rate</label>
                <div class="pct">
                  <input type="number" name="tax_rate" id="tax-rate" min="0" max="100" step="0.1" value="0"
                    placeholder="0" oninput="calc()">
                </div>
              </div>
              <div class="f">
                <label>Discount</label>
                <div class="pct">
                  <input type="number" name="discount_rate" id="disc-rate" min="0" max="100" step="0.1" value="0"
                    placeholder="0" oninput="calc()">
                </div>
              </div>
              <div class="f" style="grid-column:1 / -1">
                <label>Notes / Payment Terms</label>
                <textarea name="notes" rows="3"
                  placeholder="Payment due within 30 days. Bank transfer: BSB 123-456, Acct 987654321.&#10;Please reference invoice number when transferring."></textarea>
              </div>
            </div>
          </div>
        </div>

      </div><!-- /left -->

      <!-- ── Right: Live Summary ── -->
      <div class="right">
        <div class="sum-card">

          <div class="sum-head">
            <h3>Invoice Summary</h3>
            <div class="inv-ref" id="sum-ref">INV-001</div>
          </div>

          <div class="sum-body">
            <div class="sum-row">
              <span class="sl">Items</span>
              <span class="sv" id="s-items">1 item</span>
            </div>
            <div class="sum-row">
              <span class="sl">Subtotal</span>
              <span class="sv" id="s-sub">$0.00</span>
            </div>
            <div class="sum-row" id="tax-row" style="display:none">
              <span class="sl" id="tax-label">Tax (0%)</span>
              <span class="sv" id="s-tax">$0.00</span>
            </div>
            <div class="sum-row" id="disc-row" style="display:none">
              <span class="sl" id="disc-label">Discount (0%)</span>
              <span class="sv disc" id="s-disc">−$0.00</span>
            </div>
            <div class="sum-hr"></div>
          </div>

          <div class="sum-total">
            <span class="st-label">Total Due</span>
            <span class="st-value" id="s-total">$0.00</span>
          </div>

          <div class="sum-foot">
            <button type="submit" class="gen-btn" id="gen-btn">
              <span class="sp" id="sp"></span>
              <span class="bl">Generate PDF ↓</span>
            </button>
          </div>

        </div>
      </div><!-- /right -->

    </div><!-- /wrap -->
  </form>

  <script src="script.js"></script>

</body>

</html>
